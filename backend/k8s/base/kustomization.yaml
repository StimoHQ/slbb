apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# slbb-secrets / slbb-config / kafka-config / pgadmin-servers сюда не входят: они выводятся из .env
# скриптом k8s/apply-env.sh и применяются до этого kustomization.
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - pgadmin.yaml
  - libretranslate.yaml
