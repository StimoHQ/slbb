services:
    postgres:
        container_name: postgres
        image: docker.io/library/postgres:18
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data_slbb:/var/lib/postgresql
        networks:
            - slbb-network
        restart: always

    pgadmin:
        container_name: pgadmin
        image: docker.io/dpage/pgadmin4:latest
        ports:
            - "${PGADMIN_PORT}:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        volumes:
            - pgadmin_data_slbb:/var/lib/pgadmin
        networks:
            - slbb-network
        restart: always

    libretranslate:
        container_name: libretranslate
        image: docker.io/libretranslate/libretranslate:latest
        ports:
            - "${LIBRETRANSLATE_PORT}:5000"
        environment:
            LT_LOAD_ONLY: "en,ru"
        volumes:
            - libretranslate_data_slbb:/var/lib/libretranslate
        networks:
            - slbb-network
        restart: always

networks:
    slbb-network:
        driver: bridge

volumes:
    postgres_data_slbb:
    pgadmin_data_slbb:
    libretranslate_data_slbb:
